spring:
  application:
    name: receitas-que-sabem

  datasource:
    # Os valores por omissão apontam para o Postgres do docker-compose.
    # Em produção, as três variáveis são definidas no painel do Render.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/receitas}
    username: ${DATABASE_USER:receitas}
    password: ${DATABASE_PASSWORD:receitas}
    hikari:
      maximum-pool-size: 5   # planos gratuitos têm poucas ligações disponíveis

  jpa:
    hibernate:
      ddl-auto: validate     # o schema é do Flyway; o Hibernate só confirma
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}         # o Render injeta a variável PORT

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.receitasquesabem: DEBUG
