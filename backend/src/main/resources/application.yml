spring:
  application:
    name: receitas-que-sabem

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/receitas}
    username: ${DATABASE_USER:receitas}
    password: ${DATABASE_PASSWORD:receitas}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never   # as tabelas vêm na migration V2
    timeout: 30d

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: RECEITAS_SESSION
        http-only: true
        # Em produção (domínios diferentes) tem de ser None+Secure.
        # Em casa, Lax chega, porque localhost:5173 e localhost:8080
        # são o mesmo "site" para o browser.
        same-site: ${COOKIE_SAME_SITE:Lax}
        secure: ${COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.receitasquesabem: DEBUG
