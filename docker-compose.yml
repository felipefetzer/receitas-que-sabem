services:
  db:
    image: postgres:16-alpine
    container_name: receitas-db
    environment:
      POSTGRES_DB: receitas
      POSTGRES_USER: receitas
      POSTGRES_PASSWORD: receitas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receitas -d receitas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: receitas-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/receitas
      DATABASE_USER: receitas
      DATABASE_PASSWORD: receitas
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  pgdata:
